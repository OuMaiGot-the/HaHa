name: Build HaHa learner preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone physics learning preview
        run: python scripts/build_catalog_release.py preview
      - name: Verify static preview assets
        run: |
          test -s preview/index.html
          test -s preview/catalog.json
          test -s preview/learn/chapter-9/section-9-1/app/app.js
          test -s preview/learn/chapter-9/section-9-1/app/domain-renderers.js
          test -s preview/learn/chapter-9/section-9-1/content/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: haha-learning-preview
          path: preview/
          include-hidden-files: true
