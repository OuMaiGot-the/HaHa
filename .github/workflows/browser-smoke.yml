name: Browser smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build learner preview
        run: python scripts/build_catalog_release.py preview
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python -m http.server 8765 --directory preview >/tmp/haha-preview-server.log 2>&1 &
          python scripts/wait_preview.py
          result=0
          for suite in preview catalog mastery study_hub subjects usability mana upstream_integration math_mastery physics_notes friction_guide; do
            node "scripts/smoke_${suite}_browser.cjs" || result=1
          done
          exit "$result"
