name: Publish HaHa preview branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build learner website
        run: python scripts/build_catalog_release.py preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify learner experience before publishing
        run: |
          python -m http.server 8765 --directory preview >/tmp/haha-preview-server.log 2>&1 &
          python scripts/wait_preview.py
          node scripts/smoke_preview_browser.cjs
          node scripts/smoke_catalog_browser.cjs
          node scripts/smoke_mastery_browser.cjs
          node scripts/smoke_study_hub_browser.cjs
      - name: Publish static files to gh-pages branch
        run: |
          set -euo pipefail
          cd preview
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish standalone HaHa learning preview"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/OuMaiGot-the/HaHa.git"
          git push --force origin HEAD:gh-pages
      - name: Deploy validated website to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_urMZbyiHo8i4lhBvELhtYW5c
          VERCEL_PROJECT_ID: prj_1cJudJvQX7wVzAfq3o7hfsqcbG6c
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@latest deploy preview --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          echo "Deployment URL: $deployment_url"
          DEPLOYMENT_URL="$deployment_url" python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          base = os.environ["DEPLOYMENT_URL"].strip().rstrip("/")
          if not base.startswith("https://"):
              raise SystemExit("Vercel did not return a valid HTTPS deployment URL")
          for attempt in range(12):
              try:
                  with urlopen(base + "/catalog.json", timeout=15) as response:
                      catalog = json.load(response)
                  if not isinstance(catalog, list) or len(catalog) < 15:
                      raise ValueError("Production catalog is missing expected lessons")
                  with urlopen(base + "/" + catalog[0]["url"], timeout=15) as response:
                      if response.status != 200:
                          raise ValueError("First lesson did not return HTTP 200")
                  print("Production verification passed:", len(catalog), "lessons")
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
