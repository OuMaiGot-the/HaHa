name: Publish HaHa preview branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build learner website
        run: python scripts/build_public_release.py content/chapter-9/section-9-1/package.json preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify learner experience before publishing
        run: |
          python -m http.server 8765 --directory preview >/tmp/haha-preview-server.log 2>&1 &
          node scripts/smoke_preview_browser.cjs
      - name: Publish static files to gh-pages branch
        run: |
          set -euo pipefail
          cd preview
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish standalone HaHa learning preview"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/OuMaiGot-the/HaHa.git"
          git push --force origin HEAD:gh-pages
