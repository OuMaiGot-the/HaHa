name: Deploy HaHa learning catalog to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: haha-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build independent learner preview
        run: python scripts/build_catalog_release.py preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify complete catalog before Pages deployment
        run: |
          python -m http.server 8765 --directory preview >/tmp/haha-pages-server.log 2>&1 &
          python scripts/wait_preview.py
          node scripts/smoke_preview_browser.cjs
          node scripts/smoke_catalog_browser.cjs
          node scripts/smoke_mastery_browser.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy to HaHa GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
