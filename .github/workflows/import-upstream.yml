name: Complete source migration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/tlyoon/brilliant.org-style-learning-apps.git /tmp/upstream
      - run: |
          rsync -a --exclude='.git/' --exclude='.github/workflows/' /tmp/upstream/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete upstream source migration'
            git push
          fi
